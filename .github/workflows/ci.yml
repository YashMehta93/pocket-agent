# Checks every PR and every push to the release lines. No secrets: test builds are signed with a throwaway key,
# and real releases are still built and signed on the owner's phone (docs/RELEASES.md).
# Tests that need a real Claude account (test:server, test:ui:live) or a Termux server don't run here.
name: CI
on:
  pull_request:
  push:
    branches: [master, "v*.x"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci --no-audit --no-fund
      - run: cd server && npm ci --omit=optional --no-audit --no-fund
      - name: Syntax
        run: for f in server/src/*.js app/assets/ui/js/*.js scripts/*.mjs; do node --check "$f"; done
      - run: npm run test:extras
      - run: npm run test:services
      - run: npm run test:setup

  apk:
    name: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android build tools on PATH
        run: echo "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)" >> "$GITHUB_PATH"
      - run: bash scripts/fetch-android-jar.sh
      - run: npm ci --no-audit --no-fund
      - run: cd server && npm ci --omit=optional --no-audit --no-fund
      - name: Release dry run (Java compiles, APK and code bundle build)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash scripts/release.sh --dry-run
      - run: npm run test:github
      - run: npm run test:upgrade
      - run: npm run test:tar
      - name: Screens and the phone channel (against a throwaway server; needs the APK built above)
        run: |
          node server/src/index.js --port 8766 > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8766/health >/dev/null && break; sleep 0.25; done
          PA_PORT=8766 npm run test:native
          PA_PORT=8766 npm run test:ui
      - if: failure()
        run: tail -50 /tmp/server.log || true
