# Every PR links an issue and has a type label, and every commit mentions an issue (docs/RELEASES.md, "Tracking").
# The label "policy: exempt" skips the issue checks (old work, emergencies). Change the rules here.
name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  pull-requests: read
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);
            const problems = [];
            if (!labels.some(l => l.startsWith("type: "))) problems.push('Add a "type: …" label (bug, feature, security, docs, chore, test, release).');
            if (!labels.includes("policy: exempt")) {
              if (!/\b(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|part of)\s+#\d+/i.test(pr.body || ""))
                problems.push('Link an issue in the description: "Closes #N" (or "Refs #N" / "Part of #N").');
              const commits = await github.paginate(github.rest.pulls.listCommits, { ...context.repo, pull_number: pr.number, per_page: 100 });
              const bare = commits.filter(c => c.parents.length < 2 && !/#\d+/.test(c.commit.message));
              if (bare.length) problems.push(`Mention an issue in every commit message, e.g. "Fix the double open (#19)". Missing in: ${bare.map(c => c.sha.slice(0, 7) + " " + c.commit.message.split("\n")[0]).join("; ")}`);
            }
            if (problems.length) core.setFailed(problems.join("\n"));
            else core.info("PR policy: ok");
